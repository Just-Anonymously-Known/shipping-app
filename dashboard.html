<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTransit - User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">

    <header class="bg-slate-900 text-white px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold tracking-tight">Global<span class="text-blue-500">Transit</span></span>
            <span id="userGreeting" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full font-medium ml-2"></span>
        </div>
        <div class="flex items-center space-x-6 text-sm font-medium text-slate-300">
            <a href="index.html" class="hover:text-white">Home</a>
            <button onclick="logout()" class="text-red-400 hover:text-red-300">Sign Out</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12 space-y-10">
        <!-- Booking Form Section -->
        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
            <div class="mb-6">
                <h1 class="text-xl font-bold text-slate-900">Book US Domestic / International Shipment</h1>
                <p class="text-slate-500 text-xs mt-1">Fill out parcel details. Automated email tracking confirmation will be dispatched.</p>
            </div>

            <form id="shipmentForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Sender Name</label>
                    <input type="text" id="senderName" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Recipient Name</label>
                        <input type="text" id="recipientName" required placeholder="e.g. John Doe" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Recipient Phone (US)</label>
                        <input type="text" id="recipientPhone" required placeholder="+1 (555) 482-9100" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Recipient Email</label>
                    <input type="email" id="recipientEmail" required placeholder="recipient@example.com" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Destination Address / State</label>
                    <input type="text" id="destination" required placeholder="e.g. Los Angeles, California, USA" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition text-sm shadow-sm mt-2">Confirm & Book Shipment</button>
            </form>
        </div>

        <!-- User Shipment History Section -->
        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
            <h2 class="text-lg font-bold text-slate-900 mb-1">Your Booking History</h2>
            <p class="text-xs text-slate-400 mb-6">Review all shipments you have initiated from this account.</p>
            
            <div id="historyList" class="space-y-3">
                <p class="text-sm text-slate-400">Loading your shipments...</p>
            </div>
        </div>
    </main>

    <script>
        const name = localStorage.getItem('userName');
        if (!name || localStorage.getItem('isAdmin') === 'true') {
            window.location.href = 'auth.html';
        } else {
            document.getElementById('userGreeting').innerText = `Welcome, ${name}`;
            document.getElementById('senderName').value = name;
            loadUserHistory(name);
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'auth.html';
        }

        async function loadUserHistory(senderName) {
            try {
                const res = await fetch(`http://localhost:3000/api/shipments/user/${encodeURIComponent(senderName)}`);
                const shipments = await res.json();
                const historyList = document.getElementById('historyList');

                if (shipments.length === 0) {
                    historyList.innerHTML = `<p class="text-sm text-slate-400">No shipments booked yet.</p>`;
                    return;
                }

                historyList.innerHTML = '';
                shipments.forEach(s => {
                    historyList.innerHTML += `
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 border border-slate-100 rounded-xl bg-slate-50 gap-2">
                            <div>
                                <span class="text-xs font-bold text-blue-600">${s.tracking_number}</span>
                                <h4 class="text-sm font-bold text-slate-800 mt-0.5">To: ${s.destination} (${s.recipient_name})</h4>
                                <p class="text-xs text-slate-400">Booked: ${new Date(s.created_at).toLocaleString()}</p>
                            </div>
                            <span class="bg-blue-100 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-full">${s.status}</span>
                        </div>
                    `;
                });
            } catch (err) {
                console.error('History load error:', err);
            }
        }

        document.getElementById('shipmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const senderName = document.getElementById('senderName').value;
            const recipientName = document.getElementById('recipientName').value;
            const recipientPhone = document.getElementById('recipientPhone').value;
            const recipientEmail = document.getElementById('recipientEmail').value;
            const destination = document.getElementById('destination').value;

            try {
                const res = await fetch('http://localhost:3000/api/shipments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senderName, recipientName, recipientEmail, recipientPhone, destination })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`Shipment booked successfully!\nTracking Number: ${data.trackingNumber}`);
                    document.getElementById('shipmentForm').reset();
                    document.getElementById('senderName').value = localStorage.getItem('userName');
                    loadUserHistory(localStorage.getItem('userName'));
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.error(err);
                alert('Server connection error.');
            }
        });
    </script>
</body>
</html>
