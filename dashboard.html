<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTransit - User Dashboard & Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 font-sans antialiased text-slate-800 min-h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center text-white">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-black tracking-tight">Global<span class="text-blue-500">Transit</span></span>
            <span id="welcomeUser" class="text-xs bg-slate-700 px-2 py-0.5 rounded font-medium">Welcome</span>
        </div>
        <button onclick="logout()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">Sign Out</button>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-8">

        <!-- Book Shipment Form -->
        <div class="bg-white rounded-2xl shadow-xl p-6 space-y-6">
            <div>
                <h2 class="text-lg font-bold text-slate-900">Book a New Shipment</h2>
                <p class="text-xs text-slate-500 mt-0.5">Fill in the recipient details below to generate your tracking number.</p>
            </div>

            <form id="bookingForm" onsubmit="handleBooking(event)" class="space-y-4 text-xs sm:text-sm">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-slate-500 uppercase mb-1">Sender Name</label>
                        <input type="text" id="senderName" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-500 uppercase mb-1">Recipient Name</label>
                        <input type="text" id="recipientName" required placeholder="John Doe" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-slate-500 uppercase mb-1">Recipient Email</label>
                        <input type="email" id="recipientEmail" required placeholder="recipient@example.com" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-500 uppercase mb-1">Recipient Phone</label>
                        <input type="tel" id="recipientPhone" required placeholder="+1 (555) 000-0000" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-500 uppercase mb-1">Destination Address / State</label>
                    <input type="text" id="destination" required placeholder="Los Angeles, California, USA" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-slate-500 uppercase mb-1">Shipping Fee ($)</label>
                        <input type="text" id="displayFee" readonly value="Loading..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg font-bold text-emerald-600 outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-500 uppercase mb-1">Select Payment Method</label>
                        <select id="paymentMethod" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                            <option value="bitcoin">Bitcoin (BTC)</option>
                            <option value="zelle">Zelle Transfer</option>
                            <option value="cashapp">Cash App</option>
                            <option value="venmo">Venmo</option>
                            <option value="paypal">PayPal</option>
                            <option value="bankwire">Bank Wire Transfer</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition shadow-sm">Confirm Booking & Proceed to Payment</button>
            </form>
        </div>

    </main>

    <script>
        const userName = localStorage.getItem('userName');
        if (!userName) {
            window.location.href = 'auth.html';
        } else {
            document.getElementById('welcomeUser').innerText = userName;
            document.getElementById('senderName').value = userName;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'auth.html';
        }

        async function loadFee() {
            try {
                const res = await fetch('/api/admin/payment-settings');
                const settings = await res.json();
                const fee = settings.shipping_fee || '150.00';
                document.getElementById('displayFee').value = `$${fee}`;
            } catch (err) {
                document.getElementById('displayFee').value = '$150.00';
            }
        }
        loadFee();

        async function handleBooking(e) {
            e.preventDefault();
            const payload = {
                senderName: document.getElementById('senderName').value.trim(),
                recipientName: document.getElementById('recipientName').value.trim(),
                recipientEmail: document.getElementById('recipientEmail').value.trim(),
                recipientPhone: document.getElementById('recipientPhone').value.trim(),
                destination: document.getElementById('destination').value.trim(),
                paymentMethod: document.getElementById('paymentMethod').value
            };

            try {
                const res = await fetch('/api/shipments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = `payment-instructions.html?tracking=${data.trackingNumber}&method=${payload.paymentMethod}`;
                } else {
                    alert(data.message || 'Error booking shipment.');
                }
            } catch (err) {
                console.error(err);
                alert('Connection error.');
            }
        }
    </script>
</body>
</html>
