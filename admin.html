<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTransit - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">

    <header class="bg-slate-900 text-white px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold tracking-tight">Global<span class="text-blue-500">Transit</span></span>
            <span class="text-xs bg-blue-600 text-white font-semibold px-2 py-0.5 rounded-full">Admin Control Center</span>
        </div>
        <div class="flex items-center space-x-6 text-sm font-medium text-slate-300">
            <a href="index.html" class="hover:text-white">Public Site</a>
            <button onclick="logout()" class="text-red-400 hover:text-red-300">Sign Out</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Logistics Control Center</h1>
            <p class="text-slate-500 text-sm mt-1">Post real-time transit checkpoints and update US parcel scan locations.</p>
        </div>

        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
            <h3 class="text-lg font-bold text-slate-900 mb-1">Add New Transit Checkpoint</h3>
            <p class="text-xs text-slate-400 mb-6">This will instantly update the public timeline feed.</p>

            <form id="checkpointForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Tracking Number</label>
                    <input type="text" id="adminTrackingNum" required placeholder="e.g. GT-482910" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm uppercase focus:ring-2 focus:ring-blue-600 outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Current Facility / Location</label>
                        <input type="text" id="adminLocation" required placeholder="e.g. Chicago Sorting Hub, IL" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Status Description</label>
                        <select id="adminStatus" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-600 outline-none">
                            <option value="In Transit">In Transit</option>
                            <option value="Arrived at Facility">Arrived at Facility</option>
                            <option value="Out for Delivery">Out for Delivery</option>
                            <option value="Delivered Successfully">Delivered Successfully</option>
                            <option value="Exception / Delayed">Exception / Delayed</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition text-sm shadow-sm mt-2">Post Checkpoint Scan</button>
            </form>
        </div>
    </main>

    <script>
        // Enforce hidden admin portal protection
        if (localStorage.getItem('isAdmin') !== 'true') {
            alert('Unauthorized access. Please sign in with administrator credentials.');
            window.location.href = 'auth.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'auth.html';
        }

        document.getElementById('checkpointForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const trackingNumber = document.getElementById('adminTrackingNum').value.trim();
            const location = document.getElementById('adminLocation').value.trim();
            const statusDescription = document.getElementById('adminStatus').value;

            try {
                const response = await fetch(`http://localhost:3000/api/shipments/${trackingNumber}/events`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location, statusDescription })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`Checkpoint successfully posted for ${trackingNumber}!`);
                    document.getElementById('checkpointForm').reset();
                } else {
                    alert(data.message || 'Failed to post checkpoint.');
                }
            } catch (err) {
                console.error(err);
                alert('Connection error with the server.');
            }
        });
    </script>
</body>
</html>
