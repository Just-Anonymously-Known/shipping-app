<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTransit - Global Logistics & Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">

    <!-- Navbar -->
    <header class="bg-slate-900 text-white px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold tracking-tight">Global<span class="text-blue-500">Transit</span></span>
        </div>
        <div class="flex items-center space-x-6 text-sm font-medium text-slate-300">
            <a href="index.html" class="text-white">Home</a>
            <a href="auth.html" class="hover:text-white">Sign In / Register</a>
            <a href="dashboard.html" class="hover:text-white">Dashboard</a>
            <a href="admin.html" class="hover:text-white">Admin Portal</a>
        </div>
    </header>

    <!-- Hero Section with Public Tracker -->
    <main class="max-w-4xl mx-auto px-6 py-16 text-center">
        <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-4">Fast & Reliable Global Logistics</h1>
        <p class="text-slate-500 text-base mb-10 max-w-xl mx-auto">Track your international cargo live with instant milestone updates delivered directly to your inbox and phone.</p>

        <!-- Search Box -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm max-w-2xl mx-auto flex flex-col sm:flex-row gap-3">
            <input type="text" id="trackInput" placeholder="Enter Tracking Number (e.g. GT-482910)" class="flex-1 px-4 py-3 border border-slate-200 rounded-lg text-sm uppercase focus:ring-2 focus:ring-blue-600 outline-none">
            <button onclick="trackShipment()" class="bg-blue-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-blue-700 transition text-sm shadow-sm">Track Package</button>
        </div>

        <!-- Tracking Results Container -->
        <div id="resultContainer" class="mt-10 hidden text-left max-w-2xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-6">
                <div>
                    <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Tracking Number</span>
                    <h3 id="resTrackingNum" class="text-xl font-bold text-slate-900"></h3>
                </div>
                <span id="resStatusBadge" class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full"></span>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-8 text-sm">
                <div>
                    <p class="text-slate-400 text-xs font-semibold uppercase">Destination</p>
                    <p id="resDestination" class="font-medium text-slate-800 mt-0.5"></p>
                </div>
                <div>
                    <p class="text-slate-400 text-xs font-semibold uppercase">Recipient Name</p>
                    <p id="resRecipient" class="font-medium text-slate-800 mt-0.5"></p>
                </div>
            </div>

            <h4 class="text-sm font-bold text-slate-900 uppercase tracking-wider mb-4">Transit History Feed</h4>
            <div id="timelineList" class="space-y-4 border-l-2 border-blue-600 pl-4 ml-2"></div>
        </div>
    </main>

    <script>
        async function trackShipment() {
            const trackingNumber = document.getElementById('trackInput').value.trim();
            if (!trackingNumber) return alert('Please enter a tracking number.');

            try {
                const res = await fetch(`http://localhost:3000/api/shipments/${trackingNumber}`);
                const data = await res.json();

                if (!res.ok) {
                    alert(data.message || 'Shipment not found.');
                    document.getElementById('resultContainer').classList.add('hidden');
                    return;
                }

                document.getElementById('resTrackingNum').innerText = data.tracking_number;
                document.getElementById('resStatusBadge').innerText = data.status;
                document.getElementById('resDestination').innerText = data.destination;
                document.getElementById('resRecipient').innerText = data.recipient_name;

                // Fetch events timeline
                const eventRes = await fetch(`http://localhost:3000/api/shipments/${trackingNumber}/events`);
                const events = await eventRes.json();

                const timelineList = document.getElementById('timelineList');
                timelineList.innerHTML = '';

                events.forEach(ev => {
                    timelineList.innerHTML += `
                        <div class="relative pb-4">
                            <div class="absolute -left-[21px] top-1 w-3 h-3 bg-blue-600 rounded-full border-2 border-white"></div>
                            <p class="text-xs text-slate-400 font-medium">${new Date(ev.created_at).toLocaleString()}</p>
                            <p class="text-sm font-bold text-slate-800 mt-0.5">${ev.status_description} — <span class="font-normal text-slate-600">${ev.location}</span></p>
                        </div>
                    `;
                });

                document.getElementById('resultContainer').classList.remove('hidden');
            } catch (err) {
                console.error(err);
                alert('Error connecting to server.');
            }
        }
    </script>
</body>
</html>
