<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTransit - Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800 flex flex-col min-h-screen">

    <header class="bg-slate-900 text-white px-8 py-4 flex justify-between items-center">
        <span class="text-xl font-bold tracking-tight">Global<span class="text-blue-500">Transit</span></span>
        <a href="index.html" class="text-sm text-slate-300 hover:text-white">Back to Home</a>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
            
            <div class="flex border-b border-slate-100 mb-6 pb-2">
                <button onclick="switchTab('login')" id="loginTab" class="flex-1 pb-2 text-sm font-bold text-blue-600 border-b-2 border-blue-600">Sign In</button>
                <button onclick="switchTab('register')" id="registerTab" class="flex-1 pb-2 text-sm font-semibold text-slate-400">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email Address or Username</label>
                    <input type="text" id="loginEmail" required placeholder="name@example.com or Admin" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                
                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="showLoginPass" onclick="togglePassword('loginPassword', this.id)" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    <label for="showLoginPass" class="text-xs text-slate-600 cursor-pointer select-none">Show password</label>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition text-sm shadow-sm mt-2">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="space-y-4 hidden" onsubmit="handleRegister(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Full Name</label>
                    <input type="text" id="regName" required class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email Address</label>
                    <input type="email" id="regEmail" required class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Phone Number (US)</label>
                    <input type="text" id="regPhone" required placeholder="+1 (555) 234-5678" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Password</label>
                    <input type="password" id="regPassword" required class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                </div>

                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="showRegPass" onclick="togglePassword('regPassword', this.id)" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    <label for="showRegPass" class="text-xs text-slate-600 cursor-pointer select-none">Show password</label>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition text-sm shadow-sm mt-2">Create Account</button>
            </form>
        </div>
    </main>

    <script>
        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginTab').className = "flex-1 pb-2 text-sm font-bold text-blue-600 border-b-2 border-blue-600";
                document.getElementById('registerTab').className = "flex-1 pb-2 text-sm font-semibold text-slate-400";
            } else {
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerTab').className = "flex-1 pb-2 text-sm font-bold text-blue-600 border-b-2 border-blue-600";
                document.getElementById('loginTab').className = "flex-1 pb-2 text-sm font-semibold text-slate-400";
            }
        }

        function togglePassword(fieldId, checkboxId) {
            const passwordField = document.getElementById(fieldId);
            const isChecked = document.getElementById(checkboxId).checked;
            passwordField.type = isChecked ? 'text' : 'password';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const res = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                localStorage.setItem('userName', data.name);
                localStorage.setItem('userEmail', data.email);
                
                if (data.isAdmin) {
                    localStorage.setItem('isAdmin', 'true');
                    window.location.href = 'admin.html';
                } else {
                    localStorage.removeItem('isAdmin');
                    window.location.href = 'dashboard.html';
                }
            } else {
                alert(data.message);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;

            const res = await fetch('http://localhost:3000/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, phone, password })
            });
            const data = await res.json();
            if (res.ok) {
                alert('Registration successful! Please sign in.');
                switchTab('login');
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
