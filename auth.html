<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlobalTransit - Sign In & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 font-sans antialiased text-slate-800 flex flex-col min-h-screen justify-center items-center px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
        <div class="text-center space-y-1">
            <span class="text-2xl font-black tracking-tight text-slate-900">Global<span class="text-blue-600">Transit</span></span>
            <p id="formSubtitle" class="text-xs text-slate-500">Sign in to your account or book a shipment</p>
        </div>

        <!-- Toggle Tabs -->
        <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold">
            <button onclick="switchTab('signin')" id="tabSignin" class="flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition">Sign In</button>
            <button onclick="switchTab('signup')" id="tabSignup" class="flex-1 py-2 rounded-lg text-slate-500 transition">Register</button>
        </div>

        <!-- Sign In Form -->
        <form id="signinForm" onsubmit="handleSignin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email Address</label>
                <input type="email" id="signinEmail" required placeholder="name@example.com" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Password</label>
                <input type="password" id="signinPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition text-xs sm:text-sm shadow-sm">Sign In</button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Full Name / Company</label>
                <input type="text" id="signupName" required placeholder="John Doe" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email Address</label>
                <input type="email" id="signupEmail" required placeholder="name@example.com" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Password</label>
                <input type="password" id="signupPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-xs sm:text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition text-xs sm:text-sm shadow-sm">Create Account</button>
        </form>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-slate-400 hover:text-slate-600 transition">← Back to Tracking Home</a>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const signinForm = document.getElementById('signinForm');
            const signupForm = document.getElementById('signupForm');
            const tabSignin = document.getElementById('tabSignin');
            const tabSignup = document.getElementById('tabSignup');
            const subtitle = document.getElementById('formSubtitle');

            if (tab === 'signin') {
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabSignin.className = "flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition";
                tabSignup.className = "flex-1 py-2 rounded-lg text-slate-500 transition";
                subtitle.innerText = "Sign in to your account or book a shipment";
            } else {
                signupForm.classList.remove('hidden');
                signinForm.classList.add('hidden');
                tabSignup.className = "flex-1 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition";
                tabSignin.className = "flex-1 py-2 rounded-lg text-slate-500 transition";
                subtitle.innerText = "Register a new shipping account";
            }
        }

        async function handleSignin(e) {
            e.preventDefault();
            const email = document.getElementById('signinEmail').value.trim();
            const password = document.getElementById('signinPassword').value.trim();

            // Hardcoded Admin Quick Access Check
            if (email.toLowerCase() === 'admin' && password === 'Admin@55') {
                localStorage.setItem('userName', 'Administrator');
                localStorage.setItem('isAdmin', 'true');
                window.location.href = 'admin.html';
                return;
            }

            try {
                const res = await fetch('/api/signin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('userName', data.name);
                    localStorage.setItem('isAdmin', data.is_admin ? 'true' : 'false');
                    window.location.href = data.is_admin ? 'admin.html' : 'dashboard.html';
                } else {
                    alert(data.message || 'Invalid login credentials.');
                }
            } catch (err) {
                console.error(err);
                alert('Connection error. Please try again.');
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Account created successfully! Please sign in.');
                    switchTab('signin');
                    document.getElementById('signupForm').reset();
                } else {
                    alert(data.message || 'Registration failed.');
                }
            } catch (err) {
                console.error(err);
                alert('Connection error. Please try again.');
            }
        }
    </script>
</body>
</html>
